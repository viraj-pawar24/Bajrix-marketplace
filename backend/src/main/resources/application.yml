spring:
  application:
    name: bajrix-marketplace
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/bajrix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway migrations, not Hibernate auto-DDL
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.bajrix.marketplace: INFO
