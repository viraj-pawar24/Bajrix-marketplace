version: "3.8"

services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: bajrix
      MYSQL_USER: bajrix
      MYSQL_PASSWORD: bajrix
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - bajrix_mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "bajrix", "-pbajrix"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/bajrix?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: bajrix
      DB_PASSWORD: bajrix
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  bajrix_mysqldata:
